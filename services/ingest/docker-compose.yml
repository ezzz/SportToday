services:
  sporttoday:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      INGEST_DATA_DIR: /app/data
      SPORTTODAY_TIMEZONE: ${SPORTTODAY_TIMEZONE:-Europe/Paris}
    ports:
      # Loopback only is intentional until a private network/tunnel is chosen.
      - "${SPORTTODAY_BIND_ADDRESS:-127.0.0.1}:4173:4173"
    volumes:
      - ./runtime/data:/app/data
      - ./runtime/reports:/app/reports
      - ./runtime/backups:/app/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
